<nav *ngIf="authService.isLoggedIn()" style="background:#1976d2;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;">
  <div style="display:flex;align-items:center;gap:24px;">
    <span style="color:#fff;font-size:18px;font-weight:700;">Mesa de Ayuda</span>
    <a routerLink="/tickets" style="color:rgba(255,255,255,0.9);text-decoration:none;font-size:14px;">Tickets</a>
    <a routerLink="/tickets/new" style="color:rgba(255,255,255,0.9);text-decoration:none;font-size:14px;">Nuevo Ticket</a>
  </div>
  <div style="display:flex;align-items:center;gap:16px;">
    <span style="color:rgba(255,255,255,0.9);font-size:14px;">{{ currentUser?.nombre }} ({{ currentUser?.rol }})</span>
    <button (click)="logout()" class="btn" style="background:rgba(255,255,255,0.2);color:#fff;font-size:13px;">Cerrar sesión</button>
  </div>
</nav>

<main style="padding:24px 0;">
  <div class="container">
    <router-outlet></router-outlet>
  </div>
</main>

<div style="display:flex;justify-content:center;align-items:center;min-height:80vh;">
  <div class="card" style="width:100%;max-width:400px;">
    <h2 style="margin-bottom:24px;text-align:center;color:#1976d2;">
      {{ mode === 'login' ? 'Iniciar Sesión' : 'Crear Cuenta' }}
    </h2>

    <div *ngIf="error" class="alert alert-error">{{ error }}</div>

    <form (ngSubmit)="onSubmit()">
      <div *ngIf="mode === 'register'" class="form-group">
        <label>Nombre completo</label>
        <input type="text" [(ngModel)]="nombre" name="nombre" required placeholder="Tu nombre">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" required placeholder="correo@ejemplo.com">
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="password" name="password" required placeholder="••••••••">
      </div>

      <div *ngIf="mode === 'register'" class="form-group">
        <label>Rol</label>
        <select [(ngModel)]="rol" name="rol">
          <option value="cliente">Cliente</option>
          <option value="agente">Agente</option>
          <option value="admin">Administrador</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="loading" style="width:100%;padding:12px;font-size:16px;margin-top:8px;">
        {{ loading ? 'Procesando...' : (mode === 'login' ? 'Ingresar' : 'Registrarse') }}
      </button>
    </form>

    <p style="text-align:center;margin-top:16px;font-size:14px;color:#666;">
      {{ mode === 'login' ? '¿No tienes cuenta?' : '¿Ya tienes cuenta?' }}
      <a (click)="toggleMode()" style="color:#1976d2;cursor:pointer;text-decoration:underline;">
        {{ mode === 'login' ? 'Regístrate' : 'Inicia sesión' }}
      </a>
    </p>
  </div>
</div>
